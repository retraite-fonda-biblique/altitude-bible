<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S'inscrire - Retraite Altitude Bible</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="inscription">
            <div class="container">
                <h1 class="text-center mb-5">S'inscrire</h1>
                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <div class="card shadow-lg">
                            <div class="card-body text-center p-5">
                                <div class="mb-4">
                                    <i class="fas fa-edit fa-4x text-primary"></i>
                                </div>
                                <h3 class="h4 mb-4">Inscription à la retraite</h3>
                                <p class="mb-4">Pour vous inscrire à la retraite Altitude Bible, veuillez remplir le formulaire d'inscription en cliquant sur le bouton ci-dessous (les inscriptions pour la prochaine édition d'Altitude Bible à la Flatière seront ouvertes en juin 2027).</p>
                                <button type="button" class="btn btn-secondary btn-lg disabled" aria-disabled="true" disabled>
                                    <i class="fas fa-edit me-2"></i>Formulaire
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
